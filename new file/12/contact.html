<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#003366;
    color:white;
    text-align:center;
    padding:25px;
}

.page-section{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.banner{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:15px;
    margin-bottom:40px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.contact-title{
    text-align:center;
    color:#003366;
    font-size:32px;
    margin-bottom:15px;
}

.contact-text{
    text-align:center;
    color:#555;
    font-size:18px;
    margin-bottom:40px;
    line-height:1.8;
}

.cards-container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
}

.card{
    width:300px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.card h3{
    color:#003366;
    margin-bottom:10px;
}

.card p{
    color:#555;
    line-height:1.6;
}

</style>

</head>
<body>

<header>
    <h1>Contact Us</h1>
</header>

<section class="page-section">

    <h2 class="contact-title">Get In Touch</h2>

    <p class="contact-text">
        We are here to answer your questions and help you with admissions,
        academics, and campus information. Feel free to contact us anytime.
    </p>

    <div class="cards-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800"
                 alt="Address">
            <div class="card-content">
                <h3>Address</h3>
                <p>Vel Tech College, Chennai, Tamil Nadu</p>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1557200134-90327ee9fafa?w=800"
                 alt="Email">
            <div class="card-content">
                <h3>Email</h3>
                <p>info@veltech.edu</p>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=800"
                 alt="Phone">
            <div class="card-content">
                <h3>Phone</h3>
                <p>+91 9876543210</p>
            </div>
        </div>

    </div>

</section>

</body>
</html>
